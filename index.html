<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18A สามัญสูติกรรม | รวมงาน</title>
<link rel="icon" href="https://img2.pic.in.th/551e771f80bcb3ed36.png">
<meta name="theme-color" content="#fdf8fb">
<style>
  html, body { margin: 0; height: 100%; background: #fdf8fb; }
  iframe#app { border: 0; width: 100%; height: 100%; height: 100dvh; display: block; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
          background: linear-gradient(135deg, #ffd9e6, #e6dcff 55%, #d5eaff); color: #4a4458;
          font-family: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif; transition: opacity .35s; z-index: 5; }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .sp { font-size: 54px; display: inline-block; animation: spin 1.6s linear infinite; }
  #boot p { margin: 10px 0 4px; font-weight: 700; font-size: 1.15rem; }
  #boot small { display: block; opacity: .85; }
  #boot a { color: #7a55d6; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #boot .sp { animation: none; } }
</style>
</head>
<body>
<div id="boot" role="status">
  <div>
    <div class="sp">🌸</div>
    <p>กำลังเปิดเว็บหน่วยงาน 18A…</p>
    <small>ถ้าหน้านี้ค้างนานเกินไป
      <a id="direct" href="https://script.google.com/macros/s/AKfycbyPxIMQGIcCRn61uegRBzLSlIRYpsBauMK4KeDK9EnS4AH3WNjqbK1LEJsOkff4mKUZGA/exec">กดที่นี่เพื่อเปิดโดยตรง</a></small>
  </div>
</div>

<!-- ใส่ลิงก์ Web app ของ Apps Script (ลงท้าย /exec) ในช่อง src ด้านล่าง -->
<iframe id="app" title="เว็บหน่วยงาน 18A สามัญสูติกรรม"
        src="https://script.google.com/macros/s/AKfycbyPxIMQGIcCRn61uegRBzLSlIRYpsBauMK4KeDK9EnS4AH3WNjqbK1LEJsOkff4mKUZGA/exec"
        allow="clipboard-read; clipboard-write; fullscreen"></iframe>

<script>
  (function () {
    var boot = document.getElementById('boot'), f = document.getElementById('app');
    function done() { boot.classList.add('hide'); setTimeout(function () { boot.style.display = 'none'; }, 400); }
    f.addEventListener('load', done);
    setTimeout(done, 15000); // กันหน้าโหลดค้าง: ซ่อนหน้าโหลดหลัง 15 วินาที (ลิงก์ "เปิดโดยตรง" ยังกดได้จากหน้านี้ถ้าจำเป็น)
  })();
</script>
<noscript>
  <p style="padding:24px;font-family:sans-serif">ต้องเปิด JavaScript — หรือเปิดเว็บโดยตรงที่
    <a href="https://script.google.com/macros/s/AKfycbyPxIMQGIcCRn61uegRBzLSlIRYpsBauMK4KeDK9EnS4AH3WNjqbK1LEJsOkff4mKUZGA/exec">ลิงก์นี้</a></p>
</noscript>
</body>
</html>
